name: Daily Job Discovery

on:
  schedule:
    # 04:32 UTC = 10:02 IST. GitHub's scheduler queues cron jobs and can run
    # a few minutes late during high load -- treat this as "around 10:02 IST",
    # not to-the-second precise.
    - cron: "32 4 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job discovery
        run: python scraper/main.py

      - name: Commit updated data
        run: |
          git config user.name "job-discovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Daily job discovery run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
